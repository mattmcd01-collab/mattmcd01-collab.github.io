<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Matthew McDonald — Writer / Director, Los Angeles.">

  <title>Matthew McDonald</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #f7f7f5;
      color: #111;
      font-family: Helvetica, Arial, sans-serif;
      min-height: 100vh;
      padding: 28px 32px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;

      font-size: 11px;
      line-height: 1.4;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .header-right {
      text-align: right;
    }

    .main {
      min-height: calc(100vh - 56px);
      display: grid;
      grid-template-columns: 1fr 42vw 1fr;
      align-items: center;
      gap: 30px;
    }

    .name {
      align-self: center;
    }

    h1 {
      font-size: clamp(60px, 9vw, 150px);
      line-height: 0.78;
      letter-spacing: -0.09em;
      font-weight: 700;
      text-transform: uppercase;
    }

    h1 span {
      display: block;
    }

    .photo-container {
      width: 100%;
    }

    .photo-container img {
      display: block;
      width: 100%;
      height: auto;
    }

    .info {
      align-self: end;
      padding-bottom: 2px;

      font-size: 12px;
      line-height: 1.7;
      letter-spacing: 0.02em;
    }

    .info a {
      color: #111;
      text-decoration: none;
      border-bottom: 1px solid #999;
      padding-bottom: 2px;
    }

    .info a:hover {
      border-color: #111;
    }

    @media (max-width: 900px) {
      body {
        padding: 22px;
      }

      .main {
        min-height: auto;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        padding: 70px 0 40px;
        gap: 35px;
      }

      .name {
        order: 1;
      }

      .photo-container {
        order: 2;
        width: 72%;
        margin-left: auto;
      }

      .info {
        order: 3;
        align-self: auto;
      }

      h1 {
        font-size: 18vw;
      }
    }

    @media (max-width: 500px) {
      .photo-container {
        width: 88%;
      }

      .header {
        font-size: 9px;
      }

      .main {
        padding-top: 55px;
      }

      h1 {
        font-size: 19vw;
      }
    }
  </style>
</head>

<body>

  <header class="header">
    <div>MM / 001</div>

    <div class="header-right">
      Los Angeles, CA
    </div>
  </header>

  <main class="main">

    <div class="name">
      <h1>
        <span>Matthew</span>
        <span>McDonald</span>
      </h1>
    </div>

    <div class="photo-container">
      <img src="portrait.jpg" alt="Matthew McDonald">
    </div>

    <div class="info">
      Writer / Director<br>
      Los Angeles, California<br><br>

      <a href="mailto:mattmcd01@gmail.com">
        mattmcd01@gmail.com
      </a>
    </div>

  </main>

</body>
</html>
